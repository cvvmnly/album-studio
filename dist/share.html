<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shareable album slideshow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="@xuan.atic" />
    <meta property="og:title" content="Summer trip | @xuan.atic" />
    <meta property="og:description" content="Warm sunsets and road trip memories." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=1200&amp;q=80" />
    <meta property="og:url" content="https://cvvmnly.github.io/album-studio/share.html?album=sample-summer-trip" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Summer trip | @xuan.atic" />
    <meta name="twitter:description" content="Warm sunsets and road trip memories." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=1200&amp;q=80" />
    <title>Shared album | @xuan.atic</title>
    <script type="module" crossorigin src="./assets/script-CYWEKqGD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/script-i1f7Z1TC.css">
  </head>
  <body data-page="share">
    <main class="share-page-shell">
      <section class="share-card hidden" id="share-page-container">
        <div class="viewer-header">
          <div>
            <p class="eyebrow"></p>
            <h2 id="share-title">Album title</h2>
          </div>
        </div>

        <div class="slideshow">
          <div class="main-media">
            <button id="share-prev" class="nav-btn" aria-label="Previous image">‹</button>
            <img id="share-main-image" src="" alt="Album photo" />
            <button id="share-next" class="nav-btn" aria-label="Next image">›</button>
          </div>

          <div class="thumb-strip-wrapper">
            <div id="share-thumb-strip" class="thumb-strip"></div>
          </div>
        </div>
      </section>

      <section id="share-empty" class="empty-state share-empty">
        <h2>Album not found</h2>
        <p>This shared album could not be loaded. It may have been deleted or the link is incomplete.</p>
      </section>
    </main>

  </body>
</html>
