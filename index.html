<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create and share photo albums with a scrollable slideshow." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="@xuan.atic" />
    <meta property="og:title" content="@xuan.atic" />
    <meta property="og:description" content="Create and share photo albums with a scrollable slideshow." />
    <meta property="og:image" content="" />
    <meta property="og:url" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="@xuan.atic" />
    <meta name="twitter:description" content="Create and share photo albums with a scrollable slideshow." />
    <meta name="twitter:image" content="" />
    <title>@xuan.atic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">Photo albums</p>
          <h1>@xuan.atic</h1>
        </div>

        <form id="album-form" class="album-form">
          <label>
            <span>Album title</span>
            <input id="album-title" name="title" type="text" maxlength="80" placeholder="Summer trip" required />
          </label>

          <label>
            <span>Album description</span>
            <textarea id="album-description" name="description" rows="3" maxlength="220" placeholder="Add a short caption..."></textarea>
          </label>

          <label>
            <span>Year</span>
            <select id="album-year" name="year">
              <option value="2006" selected>2006</option>
              <option value="2007">2007</option>
              <option value="2008">2008</option>
              <option value="2009">2009</option>
              <option value="2010">2010</option>
              <option value="2011">2011</option>
              <option value="2012">2012</option>
              <option value="2013">2013</option>
              <option value="2014">2014</option>
              <option value="2015">2015</option>
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </label>

          <label class="file-label">
            <span>Choose photos</span>
            <input id="album-photos" type="file" accept="image/*" multiple />
          </label>

          <button type="submit" class="primary-btn">Create album</button>
        </form>

        <div class="albums-panel">
          <div class="panel-header">
            <h2>Your albums</h2>
          </div>
          <ul id="album-list" class="album-list"></ul>
        </div>
      </aside>

      <main class="main-panel">
        <div id="empty-state" class="empty-state hidden">
          <h2>No album selected</h2>
          <p>Create a new album and upload photos to start building your slideshow.</p>
        </div>

        <section id="album-view" class="album-view hidden">
          <div class="slideshow">
            <button id="prev-photo" class="nav-btn" aria-label="Previous image">‹</button>
            <div class="main-media">
              <img id="main-image" src="" alt="Selected album photo" />
            </div>
            <button id="next-photo" class="nav-btn" aria-label="Next image">›</button>

            <div class="thumb-strip-wrapper">
              <div id="thumb-strip" class="thumb-strip" aria-live="polite"></div>
            </div>
          </div>

          <div class="viewer-header">
            <div>
              <p id="album-kicker" class="eyebrow">@xuan.atic</p>
              <h2 id="album-name">@xuan.atic</h2>
            </div>

            <div class="header-actions">
              <button id="share-btn" class="secondary-btn">Copy share link</button>
              <button id="delete-btn" class="danger-btn">Delete album</button>
            </div>
          </div>

          <p id="album-date-display" class="album-date-display"></p>
          <p class="album-caption-line">
            <strong>@xuan.atic</strong>
            <span id="album-description-display"></span>
          </p>

          <div class="upload-strip">
            <label class="secondary-btn upload-btn">
              <input id="add-more-photos" type="file" accept="image/*" multiple />
              Add photos
            </label>
          </div>

        </section>
      </main>
    </div>

    <template id="album-item-template">
      <li class="album-item">
        <button type="button" class="album-item-button">
          <span class="album-item-name"></span>
          <span class="album-item-meta"></span>
        </button>
      </li>
    </template>

    <script type="module" src="script.js"></script>
  </body>
</html>
