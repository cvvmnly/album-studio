<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. HARDCODED DISCORD BOT EMBED FALLBACKS -->
    <!-- Discord WILL read these because they are normal HTML text, not JavaScript -->
    <meta property="og:title" content="📸 View My Custom Photo Album Slideshow" />
    <meta property="og:description" content="Click this link to browse the full interactive slide deck!" />
    
    <!-- IMPORTANT: Change this URL to a real placeholder image (like your logo or favorite pic) -->
    <!-- This is the image that will show up inside Discord chat when you share ANY generated link -->
    <meta property="og:image" content="https://unsplash.com" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <title>Dynamic Album Slideshow Generator</title>

    <style>
        :root {
            --bg-color: #202225;
            --container-bg: #2f3136;
            --accent-color: #5865F2;
            --text-color: #ffffff;
            --text-muted: #b9bbbe;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        h1, h2 { margin-top: 0; text-align: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: var(--text-muted); }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: #40444b;
            border: 1px solid #202225;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover { background-color: #4752c4; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #4f545c;
            border-radius: 4px;
            display: none;
            word-break: break-all;
        }
        .viewer-mode { display: none; width: 100%; max-width: 700px; text-align: center; }
        .slide-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            margin: 0;
        }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        .counter { margin-top: 10px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <!-- CREATOR MODE -->
    <div id="creatorPanel" class="container">
        <h1>Slideshow Generator</h1>
        <p style="color: var(--text-muted); text-align: center;">Paste image URLs to create a self-contained embed link.</p>
        
        <label for="albumTitle">Album Title</label>
        <input type="text" id="albumTitle" placeholder="e.g., My Art Portfolio">

        <label for="imageUrls">Image URLs (One link per line)</label>
        <textarea id="imageUrls" rows="6" placeholder="https://example.com"></textarea>

        <button onclick="generateAlbumLink()">Generate Custom Link</button>

        <div id="resultBox" class="result-box">
            <strong style="display:block; margin-bottom: 5px;">Your Discord-Ready URL:</strong>
            <input type="text" id="generatedUrl" readonly onclick="this.select()">
            <p style="font-size: 12px; color: #3ba55d; margin: 5px 0 0;">💡 Copy this URL and paste it anywhere in Discord!</p>
        </div>
    </div>

    <!-- INTERACTIVE SLIDESHOW VIEWER (Runs for human clicks) -->
    <div id="viewerPanel" class="viewer-mode">
        <h2 id="viewingTitle">Album Loading...</h2>
        <div class="slide-container">
            <button class="nav-btn prev-btn" onclick="changeSlide(-1)">❮</button>
            <img id="currentSlide" src="" alt="Slide Image">
            <button class="nav-btn next-btn" onclick="changeSlide(1)">❯</button>
        </div>
        <div class="counter" id="slideCounter">Slide 0 of 0</div>
        <button onclick="window.location.href = window.location.pathname" style="max-width: 200px; margin-top: 30px; font-size: 14px; padding: 8px;">Create New Album</button>
    </div>

    <script>
        // Real humans visiting the site will trigger this JS to pull their specific custom album images out
        const urlParams = new URLSearchParams(window.location.search);
        const albumDataRaw = urlParams.get('album') || window.location.hash.substring(1);

        let currentAlbumImages = [];
        let currentIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            if (albumDataRaw) {
                try {
                    const decoded = JSON.parse(atob(decodeURIComponent(albumDataRaw)));
                    if (decoded.images && decoded.images.length > 0) {
                        currentAlbumImages = decoded.images;
                        document.getElementById('viewingTitle').innerText = decoded.title || "Custom Slideshow";
                        document.getElementById('creatorPanel').style.display = 'none';
                        document.getElementById('viewerPanel').style.display = 'block';
                        showSlide(0);
                    }
                } catch(e) {
                    console.error("Link processing error.");
                }
            }
        });

        function generateAlbumLink() {
            const titleInput = document.getElementById('albumTitle').value.trim() || "Untitled Album";
            const rawLinks = document.getElementById('imageUrls').value.split('\n');
            const imageLinks = rawLinks.map(url => url.trim()).filter(url => url.length > 0);

            if (imageLinks.length === 0) {
                alert("Please add at least one image URL link.");
                return;
            }

            const payload = { title: titleInput, images: imageLinks };
            const encryptedString = btoa(JSON.stringify(payload));
            const finalUrl = `${window.location.origin}${window.location.pathname}?album=${encodeURIComponent(encryptedString)}`;

            document.getElementById('generatedUrl').value = finalUrl;
            document.getElementById('resultBox').style.display = 'block';
        }

        function showSlide(index) {
            if (index >= currentAlbumImages.length) currentIndex = 0;
            else if (index < 0) currentIndex = currentAlbumImages.length - 1;
            else currentIndex = index;

            document.getElementById('currentSlide').src = currentAlbumImages[currentIndex];
            document.getElementById('slideCounter').innerText = `Slide ${currentIndex + 1} of ${currentAlbumImages.length}`;
        }

        function changeSlide(direction) {
            showSlide(currentIndex + direction);
        }
    </script>
</body>
</html>
