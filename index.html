<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Link Generator</title>

    <script>
        // Reads data directly out of the link URL when loaded
        const urlParams = new URLSearchParams(window.location.search);
        const rawData = urlParams.get('album');
        let albumTitle = "Custom Slideshow";
        let firstImage = "";

        if (rawData) {
            try {
                const parsed = JSON.parse(atob(decodeURIComponent(rawData)));
                albumTitle = parsed.title || albumTitle;
                if (parsed.images && parsed.images.length > 0) {
                    firstImage = parsed.images[0];
                }
            } catch (e) {}
        }

        // Sets up the tags that Discord looks for when creating the chat preview
        document.write(`<meta property="og:title" content="📸 ${albumTitle}" />`);
        document.write(`<meta property="og:description" content="Click to view the full interactive slideshow!" />`);
        if (firstImage) {
            document.write(`<meta property="og:image" content="${firstImage}" />`);
            document.write(`<meta name="twitter:card" content="summary_large_image" />`);
        }
    </script>

    <style>
        body { font-family: sans-serif; background: #2f3136; color: white; padding: 20px; display: flex; justify-content: center; }
        .box { background: #36393f; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; text-align: center; font-size: 24px; }
        label { display: block; margin: 15px 0 5px; color: #b9bbbe; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; background: #40444b; border: 1px solid #202225; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #5865f2; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #4752c4; }
        .output { background: #4f545c; padding: 15px; border-radius: 4px; margin-top: 20px; display: none; }
        .viewer { display: none; text-align: center; }
        .slide-frame { background: black; height: 350px; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 6px; }
        .slide-frame img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 12px; cursor: pointer; font-size: 20px; }
        .prev { left: 5px; } .next { right: 5px; }
    </style>
</head>
<body>

    <!-- CREATOR MODE: Seen when making an album -->
    <div id="creator" class="box">
        <h1>Slideshow Generator</h1>
        <label>Album Title</label>
        <input type="text" id="title" placeholder="My Cool Artwork">
        
        <label>Image URLs (One link per line)</label>
        <textarea id="links" rows="6" placeholder="https://site.com"></textarea>
        
        <button onclick="makeLink()">Generate Link</button>
        
        <div id="outputBox" class="output">
            <label>Copy this link and paste to Discord:</label>
            <input type="text" id="finalLink" readonly onclick="this.select()">
        </div>
    </div>

    <!-- VIEWER MODE: Seen when opening a generated link -->
    <div id="viewer" class="box viewer">
        <h1 id="viewTitle">Loading...</h1>
        <div class="slide-frame">
            <button class="nav prev" onclick="move(-1)">❮</button>
            <img id="slideImg" src="">
            <button class="nav next" onclick="move(1)">❯</button>
        </div>
        <p id="counter" style="color: #b9bbbe; margin-top: 10px;"></p>
        <button onclick="window.location.href=window.location.pathname" style="background:#4f545c; max-width: 150px;">Make New</button>
    </div>

    <script>
        let slideImages = [];
        let index = 0;

        // Route between builder and viewer
        if (rawData) {
            try {
                const parsed = JSON.parse(atob(decodeURIComponent(rawData)));
                if (parsed.images && parsed.images.length > 0) {
                    slideImages = parsed.images;
                    document.getElementById('viewTitle').innerText = parsed.title || "Slideshow";
                    document.getElementById('creator').style.display = 'none';
                    document.getElementById('viewer').style.display = 'block';
                    renderSlide(0);
                }
            } catch(e) {}
        }

        // Build the unique link package
        function makeLink() {
            const titleVal = document.getElementById('title').value || "Untitled Album";
            const lines = document.getElementById('links').value.split('\n');
            const cleanImages = lines.map(l => l.trim()).filter(l => l.length > 0);

            if (cleanImages.length === 0) return alert("Please enter image URLs.");

            const dataStr = btoa(JSON.stringify({ title: titleVal, images: cleanImages }));
            const outUrl = `${window.location.origin}${window.location.pathname}?album=${encodeURIComponent(dataStr)}`;
            
            document.getElementById('finalLink').value = outUrl;
            document.getElementById('outputBox').style.display = 'block';
        }

        // Display current picture
        function renderSlide(target) {
            if (target >= slideImages.length) index = 0;
            else if (target < 0) index = slideImages.length - 1;
            else index = target;

            document.getElementById('slideImg').src = slideImages[index];
            document.getElementById('counter').innerText = `Slide ${index + 1} of ${slideImages.length}`;
        }

        function move(dir) { renderSlide(index + dir); }
    </script>
</body>
</html>
